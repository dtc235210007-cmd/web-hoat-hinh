<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tìm kiếm Google & Bing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px auto;
            max-width: 600px;
            text-align: center;
        }
        .search-box {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        input[type="text"] {
            width: 70%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 24px;
            outline: none;
        }
        input[type="submit"] {
            padding: 10px 18px;
            font-size: 15px;
            border: none;
            border-radius: 20px;
            background-color: #1a73e8;
            color: white;
            cursor: pointer;
            margin-left: 8px;
        }
        input[type="submit"]:hover {
            background-color: #1557b0;
        }
        .btn-bing {
            background-color: #008272 !important;
        }
        .btn-bing:hover {
            background-color: #005a4e !important;
        }
    </style>
</head>
<body>

    <!-- FORM 1: TÌM KIẾM TRÊN GOOGLE -->
    <div class="search-box">
        <h2 style="color: #4285F4;">Tìm kiếm với Google</h2>
        <form action="https://www.google.com.vn/search" method="GET" target="_blank">
            <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm trên Google..." required>
            <input type="submit" value="Google Search">
        </form>
    </div>

    <!-- FORM 2: MỞ RỘNG - TÌM KIẾM VỚI BING -->
    <div class="search-box">
        <h2 style="color: #008272;">Tìm kiếm với Bing</h2>
        <form action="https://www.bing.com/search" method="GET" target="_blank">
            <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm trên Bing..." required>
            <input type="submit" value="Bing Search" class="btn-bing">
        </form>
    </div>

</body>
</html>
