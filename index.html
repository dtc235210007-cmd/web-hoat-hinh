<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi - CSS Selectors</title>
    <!-- Liên kết file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tiêu đề h1 theo yêu cầu -->
        <h1 id="main-title">Trang web của tôi</h1>

        <!-- Đoạn văn mô tả bản thân -->
        <p class="description">
            Xin chào! Tôi là một sinh viên ngành Công nghệ thông tin với niềm đam mê lập trình web, phát triển phần mềm và yêu thích rèn luyện thể thao.
        </p>

        <!-- Danh sách 3 sở thích -->
        <div class="hobbies-wrapper">
            <h3>Sở thích cá nhân:</h3>
            <ul class="hobby-list">
                <li class="hobby-item item-tech">Lập trình và tìm hiểu công nghệ</li>
                <li class="hobby-item item-sport">Chơi bóng đá và tập luyện thể chất</li>
                <li class="hobby-item item-travel">Khám phá và du lịch trải nghiệm</li>
            </ul>
        </div>

        <!-- Nút bấm có hiệu ứng hover -->
        <div class="button-wrapper">
            <button id="btn-action" class="custom-button">Nhấn vào đây</button>
        </div>
    </div>

</body>
</html>
