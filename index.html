<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #333333;
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 70%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 16px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: #ffffff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        td:nth-child(2), td:nth-child(3) {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bàn phím cơ không dây</td>
                <td>1.250.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Chuột công thái học</td>
                <td>850.000 VNĐ</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Màn hình 24 inch IPS</td>
                <td>3.200.000 VNĐ</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Tai nghe Gaming 7.1</td>
                <td>950.000 VNĐ</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
